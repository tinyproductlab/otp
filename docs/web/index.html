<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="小产品实验室 OTP Web：在浏览器本地生成动态验证码，可选加密同步。"><title>OTP Web · 小产品实验室</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header><a class="brand" href="/"><span class="logo">OTP</span><span>小产品实验室 OTP</span></a><div class="head-actions"><span id="account-state">未登录</span><button id="account-button" class="ghost">登录同步</button><button id="lock-button" class="ghost hidden">锁定</button></div></header>
  <main>
    <section id="locked" class="unlock-card">
      <p class="eyebrow">LOCAL-FIRST AUTHENTICATOR</p><h1 id="unlock-title">建立本地保险箱</h1><p id="unlock-help">设置一个主密码。OTP 密钥会先在浏览器内加密，再保存或同步；主密码不会上传。</p>
      <label>主密码<input id="master-password" type="password" autocomplete="current-password" minlength="8" placeholder="至少 8 位"></label>
      <label id="confirm-wrap">确认主密码<input id="master-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="再次输入"></label>
      <button id="unlock-button" class="primary">建立并进入</button><p id="unlock-message" class="message"></p>
    </section>

    <section id="app" class="hidden">
      <div class="hero"><div><p class="eyebrow">OTP WEB</p><h1>验证码，留在自己手里。</h1><p>无需账号也能使用。密钥只在当前浏览器解密；登录后同步的仍是密文。</p></div><button id="add-button" class="primary">＋ 添加验证码</button></div>
      <div class="toolbar"><input id="search" type="search" placeholder="搜索平台或账号"><button id="sync-button" class="ghost">同步</button><button id="export-button" class="ghost">导出加密备份</button><label class="ghost file-label">导入备份<input id="import-file" type="file" accept="application/json"></label></div>
      <p id="app-message" class="message"></p><div id="tokens" class="token-grid"></div><div id="empty" class="empty"><div>◎</div><h2>还没有验证码</h2><p>点击右上角添加，或导入已有的加密备份。</p></div>
    </section>
  </main>

  <dialog id="add-dialog"><form method="dialog"><div class="dialog-head"><h2>添加验证码</h2><button value="cancel" class="icon">×</button></div><label>粘贴二维码内容（可选）<textarea id="uri" placeholder="otpauth://totp/..."></textarea></label><div class="or">或手动填写</div><label>平台名称<input id="issuer" placeholder="例如 GitHub"></label><label>账号<input id="account" placeholder="name@example.com"></label><label>Base32 密钥<input id="secret" autocomplete="off" spellcheck="false" placeholder="JBSWY3DPEHPK3PXP"></label><div class="form-row"><label>位数<select id="digits"><option>6</option><option>7</option><option>8</option></select></label><label>周期<select id="period"><option value="30">30 秒</option><option value="60">60 秒</option></select></label><label>算法<select id="algorithm"><option value="SHA-1">SHA-1</option><option value="SHA-256">SHA-256</option></select></label></div><label class="scan-label">从二维码图片读取<input id="qr-file" type="file" accept="image/*"></label><p id="add-message" class="message"></p><button id="save-token" value="cancel" class="primary wide">保存</button></form></dialog>

  <dialog id="account-dialog"><form method="dialog"><div class="dialog-head"><h2>可选账号同步</h2><button value="cancel" class="icon">×</button></div><p>先在账号中心用邮箱验证码登录，再回来检查登录状态。服务器只保存当前保险箱的加密文件。</p><a class="primary link-button" href="https://account.tinylabpro.com/" target="_blank" rel="noopener">打开账号中心</a><button id="check-account" value="cancel" class="ghost wide">我已登录，检查状态</button><p id="account-message" class="message"></p></form></dialog>
  <footer>小产品实验室 · 原始密钥不会以明文离开浏览器</footer><script src="app.js"></script>
</body></html>
