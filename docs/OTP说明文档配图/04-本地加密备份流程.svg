    <text x="1285" y="610" text-anchor="middle" fill="#526070" font-size="23">微信文件  或  坚果云 WebDAV</text>
  </g>
  <rect x="300" y="710" width="1000" height="80" rx="24" fill="#FFF8E8"/>
  <text x="800" y="762" text-anchor="middle" fill="#715B1B" font-size="28" font-family="PingFang SC, Arial Unicode MS, sans-serif">需要恢复时：选择备份文件 → 输入自己的备份密码 → 合并恢复到新设备</text>
